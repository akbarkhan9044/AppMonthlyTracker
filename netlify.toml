[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Friendly path for the AI summary function
[[redirects]]
  from = "/api/summary"
  to = "/.netlify/functions/summary"
  status = 200

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
