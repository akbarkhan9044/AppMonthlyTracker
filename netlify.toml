[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Friendly paths for the functions
[[redirects]]
  from = "/api/summary"
  to = "/.netlify/functions/summary"
  status = 200

[[redirects]]
  from = "/api/wakatime"
  to = "/.netlify/functions/wakatime"
  status = 200

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
