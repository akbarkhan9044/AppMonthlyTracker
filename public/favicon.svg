<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      <![CDATA[
        .paper {
          animation: floatPaper 5.2s ease-in-out infinite;
          transform-origin: 256px 256px;
        }

        .task-line {
          stroke-dasharray: 118;
          stroke-dashoffset: 118;
          animation: writeLine 4.2s ease-in-out infinite;
        }

        .task-line.two {
          animation-delay: 0.22s;
        }

        .task-line.three {
          animation-delay: 0.44s;
        }

        .check {
          stroke-dasharray: 185;
          stroke-dashoffset: 185;
          animation: drawCheck 4.2s ease-in-out infinite;
        }

        .spark {
          animation: orbit 6.4s linear infinite;
          transform-origin: 256px 256px;
        }

        .spark.alt {
          animation-duration: 8s;
          animation-direction: reverse;
        }

        .pulse {
          animation: pulse 4.2s ease-in-out infinite;
          transform-origin: 256px 256px;
        }

        @keyframes floatPaper {
          0%, 100% { transform: translateY(0) rotate(-1deg); }
          50% { transform: translateY(-10px) rotate(1deg); }
        }

        @keyframes writeLine {
          0%, 16% { stroke-dashoffset: 118; opacity: 0.18; }
          42%, 76% { stroke-dashoffset: 0; opacity: 1; }
          100% { stroke-dashoffset: -118; opacity: 0.18; }
        }

        @keyframes drawCheck {
          0%, 22% { stroke-dashoffset: 185; opacity: 0.25; }
          48%, 82% { stroke-dashoffset: 0; opacity: 1; }
          100% { stroke-dashoffset: -185; opacity: 0.25; }
        }

        @keyframes orbit {
          from { transform: rotate(0deg); }
          to { transform: rotate(360deg); }
        }

        @keyframes pulse {
          0%, 100% { opacity: 0.38; transform: scale(0.96); }
          50% { opacity: 0.72; transform: scale(1.03); }
        }

        @media (prefers-reduced-motion: reduce) {
          .paper,
          .task-line,
          .check,
          .spark,
          .pulse {
            animation: none;
          }

          .task-line,
          .check {
            stroke-dashoffset: 0;
            opacity: 1;
          }
        }
      ]]>
    </style>

    <linearGradient id="scene" x1="78" y1="62" x2="434" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F9FEFF"/>
      <stop offset="0.55" stop-color="#F1FFF8"/>
      <stop offset="1" stop-color="#F8FAFF"/>
    </linearGradient>
    <linearGradient id="paperFill" x1="182" y1="104" x2="348" y2="394" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EFFFF8"/>
    </linearGradient>
    <linearGradient id="edge" x1="174" y1="118" x2="352" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8EEBFF"/>
      <stop offset="1" stop-color="#77F2BA"/>
    </linearGradient>
    <linearGradient id="ink" x1="194" y1="172" x2="338" y2="324" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38C7F5"/>
      <stop offset="1" stop-color="#1EDC93"/>
    </linearGradient>
    <filter id="lift" x="132" y="76" width="248" height="360" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#0F172A" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#scene)"/>

  <circle class="pulse" cx="256" cy="256" r="154" stroke="#B8F7EA" stroke-width="2" stroke-dasharray="10 18"/>

  <g class="spark" opacity="0.9">
    <circle cx="256" cy="96" r="8" fill="#38C7F5"/>
    <circle cx="256" cy="416" r="5" fill="#1EDC93"/>
  </g>
  <g class="spark alt" opacity="0.85">
    <rect x="404" y="250" width="14" height="14" rx="5" fill="#9BE7FF"/>
    <rect x="94" y="248" width="10" height="10" rx="4" fill="#B8F7EA"/>
  </g>

  <g class="paper" filter="url(#lift)">
    <path d="M184 154C184 126 206 104 234 104H316C334 104 348 118 348 136V352C348 383 323 408 292 408H212C194 408 180 394 180 376V174C180 167 181 160 184 154Z" fill="url(#paperFill)"/>
    <path d="M184 154C184 126 206 104 234 104H316C334 104 348 118 348 136V352C348 383 323 408 292 408H212C194 408 180 394 180 376V174C180 167 181 160 184 154Z" stroke="url(#edge)" stroke-width="8"/>
    <path d="M300 104V145C300 158 311 169 324 169H348" stroke="#D6F9F2" stroke-width="8" stroke-linecap="round"/>

    <path class="task-line" d="M218 182C248 172 284 172 318 182" stroke="#9FB1C5" stroke-width="13" stroke-linecap="round"/>
    <path class="task-line two" d="M218 228C248 218 284 218 318 228" stroke="#9FB1C5" stroke-width="13" stroke-linecap="round"/>
    <path class="task-line three" d="M218 274C244 266 270 266 294 274" stroke="#9FB1C5" stroke-width="13" stroke-linecap="round"/>

    <path class="check" d="M203 292L242 331L324 238" stroke="url(#ink)" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="326" cy="238" r="8" fill="#38C7F5"/>
  </g>
</svg>
